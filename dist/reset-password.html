<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#dff7ff" />
  <title>ตั้งรหัสผ่านใหม่ — Ai District</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/ai-district-logo.png" />
  <link rel="stylesheet" href="auth-pages.css" />
  <script type="module" src="reset-password.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="login.html"><img src="assets/ai-district-logo.png" alt="Ai District" /><span>Ai District</span></a>
    <section class="auth-card">
      <div id="auth-icon" class="auth-icon" data-state="loading">⌁</div>
      <h1 id="auth-title">ตั้งรหัสผ่านใหม่</h1>
      <p id="auth-description">กำลังตรวจสอบลิงก์จากอีเมลของคุณ</p>
      <form id="reset-form" class="auth-form" hidden>
        <label for="new-password">รหัสผ่านใหม่</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร" required />
        <label for="confirm-password">ยืนยันรหัสผ่านใหม่</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="กรอกรหัสผ่านอีกครั้ง" required />
        <p id="reset-message" class="auth-message" role="alert" aria-live="polite"></p>
        <button class="auth-action" type="submit">บันทึกรหัสผ่านใหม่</button>
      </form>
      <div class="auth-actions"><a id="back-button" class="auth-action secondary" href="login.html" hidden>กลับไปหน้าเข้าสู่ระบบ</a></div>
    </section>
    <p class="auth-footnote">© 2026 Ai District · บัญชีของคุณได้รับการปกป้อง</p>
  </main>
</body>
</html>
