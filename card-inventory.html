<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#e8faff" />
  <title>คลังการ์ด — Ai District</title>
  <link rel="icon" href="assets/ai-district-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20261012-stage5" />

  <script type="module" src="card-inventory.js?v=20261012-stage5"></script>

<body class="card-inventory-page">
  <main class="card-inventory-shell">
    <header class="card-vault-header">
      <a href="learning.html">← กลับ Learning World</a>
      <div><small>PERMANENT UNLOCK COLLECTION</small><h1>คลัง Action Cards</h1><p>เลือกการ์ดที่ใช้ได้ 3 ใบเป็นชุดเริ่มต้นสำหรับ District Battle</p></div>
      <img src="assets/ai-district-logo.png" alt="Ai District" />
    </header>
    <section class="loadout-summary" aria-live="polite">
      <div><small>BATTLE LOADOUT</small><h2>ชุดการ์ดเริ่มต้น</h2><p>การใช้การ์ดในแมตช์จะไม่ลบสิทธิ์ปลดล็อกถาวร</p></div>
      <div id="loadout-slots" class="loadout-slots"></div>
      <button id="save-loadout" type="button">บันทึกชุดการ์ด</button>
    </section>
    <section class="card-vault-content">
      <div class="card-vault-heading"><div><small>8 ORIGINAL ACTION CARDS</small><h2>การ์ดทั้งหมด</h2></div><p id="unlock-summary">กำลังโหลดสิทธิ์การ์ด…</p></div>
      <div id="card-library" class="card-library-grid" aria-live="polite"></div>
    </section>
    <dialog id="card-detail" class="card-detail-dialog"><div id="card-detail-content"></div><button class="card-detail-close" data-close-detail type="button" aria-label="ปิด">×</button></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
